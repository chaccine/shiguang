name: ci

on:
  push:
    branches: ["feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core+cli+ts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.90.0（rust-toolchain.toml 固定）
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustc --version && cargo --version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: cargo test --locked
        run: cargo test --locked
      - name: cargo test --locked (fault-injection)
        run: cargo test --locked -p shiguang_core --features fault-injection
      - name: cargo build --locked -p shiguang
        run: cargo build --locked -p shiguang
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  tauri:
    name: tauri desktop build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux 系统库（仅 CI）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - name: Rust 1.90.0
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: cargo build --locked（src-tauri，仅编译桌面二进制，不打包）
        shell: bash
        working-directory: src-tauri
        run: |
          set -o pipefail
          mkdir -p ../ci-logs
          rustc --version | tee ../ci-logs/tauri-build-${{ runner.os }}.log
          cargo build --locked --release 2>&1 | tee -a ../ci-logs/tauri-build-${{ runner.os }}.log
      - name: 上传日志与构建产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-${{ runner.os }}
          path: |
            ci-logs/
            src-tauri/target/release/shiguang-desktop
            src-tauri/target/release/shiguang-desktop.exe
          if-no-files-found: warn
          retention-days: 7
