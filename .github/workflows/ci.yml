name: ci

on:
  push:
    branches: ["feat/**"]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  core:
    name: core+cli+ts (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Rust 1.90.0（rust-toolchain.toml 固定）
        shell: bash
        run: |
          rustup toolchain install 1.90.0 --profile minimal --component rustfmt,clippy
          rustc --version && cargo --version
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - name: cargo test --locked
        run: cargo test --locked
      - name: cargo test --locked (fault-injection)
        run: cargo test --locked -p shiguang_core --features fault-injection
      - name: cargo build --locked -p shiguang
        run: cargo build --locked -p shiguang
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  tauri:
    name: tauri bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Linux 系统库（仅 CI）
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev libssl-dev
      - name: Rust 1.90.0
        shell: bash
        run: rustup toolchain install 1.90.0 --profile minimal
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 缓存 Tauri 打包工具（WiX / NSIS）
        if: runner.os == 'Windows'
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/tauri
          key: tauri-bundler-tools-windows-v1
      - name: Tauri 打包（未签名安装包；Windows msi+nsis / macOS app+dmg / Linux deb）
        shell: bash
        run: |
          set -o pipefail
          mkdir -p ci-logs
          case "${{ runner.os }}" in
            Windows) BUNDLES="msi,nsis" ;;
            macOS)   BUNDLES="app,dmg" ;;
            *)       BUNDLES="deb" ;;
          esac
          rustc --version | tee ci-logs/tauri-bundle-${{ runner.os }}.log
          # 打包工具（WiX/NSIS）从 GitHub Releases 下载，偶发 5xx：最多重试 3 次（已编译部分会复用）。
          for attempt in 1 2 3; do
            echo "== tauri build attempt $attempt ==" | tee -a ci-logs/tauri-bundle-${{ runner.os }}.log
            if npx tauri build --ci --bundles "$BUNDLES" -- --locked 2>&1 | tee -a ci-logs/tauri-bundle-${{ runner.os }}.log; then
              ok=1; break
            fi
            ok=0; sleep $((attempt * 45))
          done
          [ "$ok" = 1 ]
          ls -R src-tauri/target/release/bundle | tee -a ci-logs/tauri-bundle-${{ runner.os }}.log
      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-log-${{ runner.os }}
          path: ci-logs/
          if-no-files-found: warn
          retention-days: 14
      - name: 上传安装包（未签名）
        uses: actions/upload-artifact@v4
        with:
          name: shiguang-${{ runner.os }}-unsigned
          path: |
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
          retention-days: 14
