[package]
name = "shiguang-desktop"
version = "0.1.9"
edition = "2021"
rust-version = "1.90"
description = "拾光 Unit-0 Tauri v2 桌面壳"
license = "MIT"

[lib]
name = "shiguang_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
shiguang_thumbnails = { path = "../thumbnails" }
zeroize = "1"
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shiguang_core = { path = "../core" }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# 独立工作区：根工作区通过 exclude 排除本目录，避免核心测试被系统库拖累。
[workspace]

# Android 侧载包是 debug 构建：口令派生与加密依赖必须优化，否则手机上解锁备份会非常慢。
[profile.dev.package.argon2]
opt-level = 3
[profile.dev.package.blake2]
opt-level = 3
[profile.dev.package.chacha20]
opt-level = 3
[profile.dev.package.poly1305]
opt-level = 3

[target.'cfg(target_os = "android")'.dependencies]
jni = "0.21"
