<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>拾光</title>
    <style>
      :root {
        color-scheme: light;
        --paper: #f7f0e7;
        --card: #fffaf4;
        --ink: #3c332d;
        --muted: #8a7a6c;
        --line: #e6d8c7;
        --wood: #8a5a38;
        --wood-dark: #70452a;
        --wood-soft: #c99b72;
        --ok: #5f7f57;
        --warn: #a56a1f;
        --danger: #a5432e;
        --shadow: 0 10px 30px rgba(96, 66, 42, 0.08);
        font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        background: radial-gradient(circle at 20% 0%, #fbf6ef 0%, var(--paper) 55%, #f1e6d9 100%);
        color: var(--ink);
      }
      [hidden] { display: none !important; }
      button, input, textarea { font: inherit; color: inherit; }
      button { cursor: pointer; }

      .app-shell {
        display: grid;
        grid-template-columns: 196px minmax(0, 1fr);
        height: 100vh;
        overflow: hidden;
      }

      .sidebar {
        display: flex;
        flex-direction: column;
        gap: 24px;
        padding: 28px 18px;
        background: linear-gradient(180deg, #efe2d2 0%, #ead9c6 100%);
        border-right: 1px solid rgba(138, 90, 56, 0.12);
      }
      .brand { padding-left: 8px; }
      .brand-title {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 0.18em;
        color: var(--wood-dark);
      }
      .brand-sub {
        display: block;
        margin-top: 4px;
        font-size: 11px;
        letter-spacing: 0.22em;
        color: #9a806c;
      }
      .tabs { display: flex; flex-direction: column; gap: 6px; }
      .tab {
        display: flex;
        align-items: center;
        gap: 10px;
        width: 100%;
        padding: 11px 14px;
        border: 1px solid transparent;
        border-radius: 12px;
        background: transparent;
        color: #5c4b3d;
        text-align: left;
        letter-spacing: 0.08em;
        transition: background 0.18s ease, color 0.18s ease, box-shadow 0.18s ease;
      }
      .tab:hover { background: rgba(255, 250, 244, 0.55); }
      .tab.is-active {
        background: var(--card);
        color: var(--wood-dark);
        box-shadow: 0 4px 14px rgba(96, 66, 42, 0.08);
      }
      .tab-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--wood-soft);
        opacity: 0.55;
      }
      .tab.is-active .tab-dot { background: var(--wood); opacity: 1; }
      .sidebar-foot {
        margin-top: auto;
        padding: 0 8px;
        font-size: 11px;
        line-height: 1.7;
        color: #9a806c;
      }

      .main {
        position: relative;
        overflow-y: auto;
        padding: 26px 34px 40px;
      }
      .main-inner { width: min(100%, 720px); margin: 0 auto; }

      .notice {
        margin-bottom: 18px;
        padding: 11px 14px;
        border-radius: 12px;
        background: #fff6e6;
        border: 1px solid #ecd4ab;
        color: #7a5a2e;
        box-shadow: 0 4px 16px rgba(140, 96, 42, 0.06);
        font-size: 13px;
        line-height: 1.6;
      }
      .notice-line { margin: 0; }
      .notice-line + .notice-line {
        margin-top: 4px;
        padding-top: 4px;
        border-top: 1px dashed rgba(140, 96, 42, 0.22);
      }
      .notice-line.preview { color: #7a5a2e; }
      .notice-line.calm { color: #6f5a46; }
      .notice-line.ok { color: #4f7149; }
      .notice-line.warn { color: #96601a; }

      .error-box {
        display: grid;
        gap: 3px;
        margin-bottom: 16px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid #e6b5a8;
        background: #fff1ed;
        color: #8c3827;
        font-size: 13px;
        line-height: 1.6;
      }
      .error-box strong { font-size: 13px; }
      .error-box span { color: #96503f; }
      .error-box.is-conflict { border-color: #e0a08f; background: #fdeee9; }

      .view { animation: rise 0.2s ease; }
      @keyframes rise {
        from { opacity: 0; transform: translateY(3px); }
        to { opacity: 1; transform: none; }
      }

      .view-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-bottom: 18px;
      }
      .view-head h1 {
        margin: 0;
        font-size: 21px;
        font-weight: 650;
        letter-spacing: 0.08em;
        color: #4b3b2f;
      }
      .view-sub { margin: 4px 0 0; font-size: 12px; color: var(--muted); }

      .button {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 9px 16px;
        border: 1px solid transparent;
        border-radius: 10px;
        background: var(--wood);
        color: #fffaf4;
        font-weight: 600;
        letter-spacing: 0.06em;
        box-shadow: 0 5px 14px rgba(138, 90, 56, 0.18);
        transition: background 0.18s ease, transform 0.18s ease, box-shadow 0.18s ease;
      }
      .button:hover { background: var(--wood-dark); }
      .button:active { transform: translateY(1px); }
      .button:disabled { opacity: 0.55; cursor: wait; }
      .button.ghost {
        background: transparent;
        color: var(--wood);
        border-color: var(--line);
        box-shadow: none;
        font-weight: 500;
      }
      .button.ghost:hover { background: #f7eee4; }

      .draft-list, .timeline-list { display: grid; gap: 12px; }
      .draft-card {
        display: block;
        width: 100%;
        padding: 16px 18px;
        border: 1px solid rgba(138, 90, 56, 0.12);
        border-radius: 16px;
        background: var(--card);
        text-align: left;
        box-shadow: var(--shadow);
        transition: transform 0.18s ease, box-shadow 0.18s ease, border-color 0.18s ease;
      }
      .draft-card:hover {
        transform: translateY(-1px);
        border-color: rgba(138, 90, 56, 0.24);
        box-shadow: 0 14px 32px rgba(96, 66, 42, 0.11);
      }
      .card-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
      .card-title { font-size: 16px; font-weight: 650; color: #43352a; }
      .card-meta {
        display: block;
        margin-top: 7px;
        font-size: 12px;
        color: var(--muted);
        letter-spacing: 0.02em;
      }
      .card-excerpt {
        display: block;
        margin: 9px 0 0;
        font-size: 13px;
        line-height: 1.65;
        color: #7c6b5c;
      }
      .pill {
        display: inline-flex;
        align-items: center;
        padding: 2px 9px;
        border-radius: 999px;
        font-size: 11px;
        line-height: 1.6;
        letter-spacing: 0.04em;
      }
      .pill.is-modifying { background: #f6e6d6; color: #96613a; }
      .pill.is-pending { background: #fff1d8; color: #9a6a22; }
      .empty-state {
        margin: 24px 0;
        padding: 34px 22px;
        border: 1px dashed #d9c7b2;
        border-radius: 16px;
        background: rgba(255, 250, 244, 0.5);
        color: #8f7d6d;
        text-align: center;
        font-size: 14px;
        line-height: 1.8;
      }

      .editor-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 14px;
      }
      .back-button {
        border: none;
        background: transparent;
        color: #8a725c;
        padding: 4px 0;
        font-size: 13px;
      }
      .back-button:hover { color: var(--wood-dark); }
      .editor-badge { margin-left: 8px; }
      .save-status {
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 8px;
        min-height: 24px;
        font-size: 12px;
        color: #8a7a6c;
        text-align: right;
        flex-wrap: wrap;
      }
      .save-status.is-saved { color: var(--ok); }
      .save-status.is-uncertain { color: var(--warn); font-weight: 600; }
      .save-status.is-error { color: var(--danger); }
      .status-text { max-width: 380px; line-height: 1.5; }
      .retry {
        padding: 3px 9px;
        border: 1px solid #d9a99c;
        border-radius: 8px;
        background: #fff7f4;
        color: #a5432e;
        font-size: 12px;
      }
      .retry:hover { background: #fdece7; }

      .editor-card {
        padding: 22px;
        border: 1px solid rgba(138, 90, 56, 0.12);
        border-radius: 20px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .editor-title {
        width: 100%;
        padding: 4px 2px 12px;
        border: none;
        border-bottom: 1px solid var(--line);
        background: transparent;
        font-size: 24px;
        font-weight: 650;
        color: #403126;
        outline: none;
      }
      .editor-title::placeholder { color: #b3a291; }
      .editor-title:focus { border-bottom-color: var(--wood-soft); }
      .when-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
        margin: 18px 0;
      }
      .field { display: grid; gap: 6px; font-size: 12px; color: #8a7665; }
      .field input {
        width: 100%;
        padding: 9px 11px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #fffdf9;
        outline: none;
      }
      .field input:focus {
        border-color: var(--wood-soft);
        box-shadow: 0 0 0 3px rgba(201, 155, 114, 0.18);
      }
      .editor-body {
        width: 100%;
        min-height: 210px;
        padding: 12px 2px;
        border: none;
        background: transparent;
        resize: vertical;
        font-size: 15px;
        line-height: 1.85;
        color: #43362c;
        outline: none;
      }
      .editor-body::placeholder { color: #b3a291; }

      .photo-section { margin-top: 10px; padding-top: 16px; border-top: 1px solid var(--line); }
      .photo-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        margin-bottom: 10px;
      }
      .photo-label { font-size: 12px; color: #8a7665; }
      .visually-hidden { position: absolute; width: 1px; height: 1px; opacity: 0; overflow: hidden; }
      .photo-pick { cursor: pointer; font-size: 13px; color: #7a5638; background: #f3e7d8; border: 1px solid #e3cfb7; border-radius: 999px; padding: 5px 14px; }
      .photo-pick:hover { background: #ecdcc6; }
      .photo-input { max-width: 230px; font-size: 12px; color: #8a7665; }
      .photo-input::file-selector-button {
        margin-right: 10px;
        padding: 6px 11px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: #f8efe4;
        color: #6f533a;
        cursor: pointer;
      }
      .photo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 10px; }
      .photo-cell {
        position: relative;
        aspect-ratio: 4 / 3;
        overflow: hidden;
        border: 1px solid rgba(138, 90, 56, 0.14);
        border-radius: 12px;
        background: #efe4d6;
      }
      .photo-thumb {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      .photo-remove {
        position: absolute;
        top: 5px;
        right: 5px;
        width: 22px;
        height: 22px;
        padding: 0;
        border: none;
        border-radius: 50%;
        background: rgba(60, 51, 45, 0.62);
        color: #fff;
        font-size: 15px;
        line-height: 22px;
      }
      .photo-remove:hover { background: rgba(60, 51, 45, 0.82); }
      .photo-empty {
        grid-column: 1 / -1;
        margin: 4px 0 0;
        font-size: 12px;
        color: #a08e7d;
      }
      .photo-fallback {
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        height: 100%;
        min-height: 70px;
        padding: 8px;
        border-radius: 12px;
        background: #f1e6d8;
        color: #8a7665;
        font-size: 11px;
        text-align: center;
      }
      .editor-foot {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin-top: 18px;
        padding-top: 16px;
        border-top: 1px solid var(--line);
      }
      .editor-hint { font-size: 12px; line-height: 1.6; color: #9b8b7b; }
      .commit-button { padding: 11px 24px; }

      .timeline-card {
        padding: 18px 20px;
        border: 1px solid rgba(138, 90, 56, 0.12);
        border-radius: 18px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .timeline-title { margin: 0; font-size: 18px; font-weight: 650; color: #43352a; }
      .timeline-body {
        margin: 10px 0 0;
        font-size: 14px;
        line-height: 1.8;
        color: #6e5d4f;
        white-space: pre-wrap;
      }
      .timeline-card .photo-grid {
        margin-top: 12px;
        grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
      }
      .timeline-card .photo-thumb {
        height: auto;
        aspect-ratio: 4 / 3;
        border: 1px solid rgba(138, 90, 56, 0.12);
        border-radius: 12px;
      }
      .card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }

      .button.danger { background: var(--danger); box-shadow: 0 5px 14px rgba(165, 67, 46, 0.18); }
      .button.danger:hover { background: #8c3827; }
      .button.ghost.danger {
        background: transparent;
        color: var(--danger);
        border-color: #e0b3a8;
        box-shadow: none;
      }
      .button.ghost.danger:hover { background: #fdeee9; }

      .trash-note {
        margin: -8px 0 14px;
        font-size: 12px;
        line-height: 1.6;
        color: #9b8b7b;
      }

      .conflict-panel {
        margin: 0 0 16px;
        padding: 14px 16px;
        border: 1px solid #e0a08f;
        border-radius: 14px;
        background: #fdeee9;
      }
      .conflict-panel .conflict-text {
        margin: 0 0 10px;
        font-size: 13px;
        line-height: 1.6;
        color: #8c3827;
      }
      .conflict-buttons { display: flex; flex-wrap: wrap; gap: 10px; }

      .conflict-copies { margin-top: 10px; }
      .conflict-copies h2 {
        margin: 0 0 4px;
        font-size: 15px;
        font-weight: 650;
        color: #4b3b2f;
      }
      .conflict-copies .conflict-hint {
        margin: 0 0 12px;
        font-size: 12px;
        color: var(--muted);
      }
      .conflict-copies .timeline-card + .timeline-card { margin-top: 12px; }

      .store-blocked {
        position: fixed;
        inset: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: calc(24px + env(safe-area-inset-top, 0px)) calc(20px + env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) calc(20px + env(safe-area-inset-left, 0px));
        background: radial-gradient(circle at 20% 0%, #fbf6ef 0%, var(--paper) 55%, #f1e6d9 100%);
      }
      .store-blocked-card {
        width: min(100%, 430px);
        padding: 30px 26px;
        border: 1px solid rgba(138, 90, 56, 0.14);
        border-radius: 20px;
        background: var(--card);
        box-shadow: var(--shadow);
      }
      .store-blocked-card h1 {
        margin: 0 0 12px;
        font-size: 20px;
        font-weight: 650;
        letter-spacing: 0.06em;
        color: var(--wood-dark);
      }
      .store-blocked-card p {
        margin: 0;
        font-size: 14px;
        line-height: 1.8;
        color: #6e5d4f;
      }
      .store-blocked-card .store-blocked-hint {
        margin-top: 14px;
        font-size: 12px;
        color: var(--muted);
      }

      .confirm-dialog {
        width: min(100% - 40px, 390px);
        padding: 22px;
        border: 1px solid rgba(138, 90, 56, 0.16);
        border-radius: 18px;
        background: var(--card);
        color: var(--ink);
        box-shadow: 0 24px 60px rgba(60, 51, 45, 0.22);
      }
      .confirm-dialog::backdrop { background: rgba(60, 51, 45, 0.38); }
      .confirm-dialog h2 {
        margin: 0 0 10px;
        font-size: 17px;
        font-weight: 650;
        color: #43352a;
      }
      .confirm-dialog p {
        margin: 0;
        font-size: 13px;
        line-height: 1.8;
        color: #7c6b5c;
      }
      .confirm-actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 18px;
      }

      @media (max-width: 760px) {
        .app-shell {
          display: flex;
          flex-direction: column;
          height: auto;
          min-height: 100vh;
          overflow: visible;
        }
        .sidebar {
          flex-direction: row;
          align-items: center;
          gap: 16px;
          /* 安全区：支持 env() 的 WebView/浏览器生效；Android 由原生 padding 处理（此时 env 为 0），桌面为 0 不变。 */
          padding: calc(14px + env(safe-area-inset-top, 0px)) calc(16px + env(safe-area-inset-right, 0px)) 14px calc(16px + env(safe-area-inset-left, 0px));
          border-right: none;
          border-bottom: 1px solid rgba(138, 90, 56, 0.12);
        }
        .brand { padding: 0; }
        .brand-title { font-size: 19px; }
        .brand-sub { display: none; }
        .tabs { flex-direction: row; margin-left: auto; }
        .tab { padding: 8px 12px; }
        .sidebar-foot { display: none; }
        .main { padding: 20px 18px calc(32px + env(safe-area-inset-bottom, 0px)); overflow: visible; }
        .when-row { grid-template-columns: 1fr; }
        .editor-card { padding: 16px; }
        .editor-title { font-size: 21px; }
        .status-text { max-width: 100%; }
        .editor-foot { flex-direction: column; align-items: stretch; }
        .commit-button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar">
        <div class="brand">
          <div class="brand-title">拾光</div>
          <span class="brand-sub">把小事留住</span>
        </div>
        <nav class="tabs" aria-label="主要视图">
          <button type="button" class="tab is-active" data-testid="drafts-tab" role="tab" aria-selected="true">
            <span class="tab-dot"></span>草稿
          </button>
          <button type="button" class="tab" data-testid="timeline-tab" role="tab" aria-selected="false">
            <span class="tab-dot"></span>时光
          </button>
          <button type="button" class="tab" data-testid="trash-tab" role="tab" aria-selected="false">
            <span class="tab-dot"></span>回收站
          </button>
        </nav>
        <div class="sidebar-foot">所有文字和照片<br />都留在这台设备上。</div>
      </aside>

      <main class="main">
        <div class="main-inner">
          <div data-testid="notice" id="notice" class="notice" hidden>
            <p id="preview-notice" class="notice-line preview" hidden></p>
            <p id="app-notice" class="notice-line" hidden></p>
          </div>
          <div data-testid="error-box" id="error-box" class="error-box" role="alert" hidden></div>

          <section id="view-drafts" class="view">
            <header class="view-head">
              <div>
                <h1>草稿</h1>
                <p class="view-sub">没写完也没关系，它们会在这里等你。</p>
              </div>
              <button type="button" class="button" data-testid="new-draft" id="new-draft">新建草稿</button>
            </header>
            <div id="draft-list" class="draft-list"></div>
          </section>

          <section id="view-editor" class="view" hidden>
            <div class="editor-head">
              <div>
                <button type="button" class="back-button" id="back-to-drafts" data-testid="back-to-drafts">← 全部草稿</button>
                <span id="editor-badge" class="pill is-modifying editor-badge" hidden>修改中</span>
              </div>
              <div data-testid="save-status" id="save-status" class="save-status" aria-live="polite"></div>
            </div>
            <div id="conflict-actions" data-testid="conflict-actions" class="conflict-panel" hidden>
              <p class="conflict-text">先核对两个版本，再选择如何处理：</p>
              <div class="conflict-buttons">
                <button type="button" class="button" data-testid="keep-mine" id="keep-mine">以我的草稿为准</button>
                <button type="button" class="button ghost" data-testid="keep-formal" id="keep-formal">保留现在的正式版</button>
              </div>
            </div>
            <div class="editor-card">
              <input id="editor-title" data-testid="editor-title" class="editor-title" type="text" maxlength="120" placeholder="给这段时光起个名字（可留空）" autocomplete="off" />
              <div class="when-row">
                <label class="field">事件日期
                  <input id="editor-date" data-testid="editor-date" type="date" />
                </label>
                <label class="field">事件时刻（可留空）
                  <input id="editor-time" data-testid="editor-time" type="time" />
                </label>
              </div>
              <textarea id="editor-body" data-testid="editor-body" class="editor-body" placeholder="写下此刻的小事……"></textarea>
              <div class="photo-section">
                <div class="photo-head">
                  <span class="photo-label">照片</span>
                  <label class="photo-pick" for="photo-input">＋ 添加照片</label>
                  <input id="photo-input" data-testid="photo-input" class="visually-hidden" type="file" accept="image/*" multiple />
                </div>
                <div id="photo-grid" class="photo-grid"></div>
              </div>
              <div class="editor-foot">
                <span class="editor-hint">日期必填，时刻可以留空；正文或至少一张照片，就能存入时光。</span>
                <button type="button" class="button commit-button" data-testid="commit-button" id="commit-button">存入时光</button>
              </div>
            </div>
          </section>

          <section id="view-timeline" class="view" hidden>
            <header class="view-head">
              <div>
                <h1>时光</h1>
                <p class="view-sub">已经好好收起来的小事。</p>
              </div>
            </header>
            <div id="timeline-list" class="timeline-list"></div>
          </section>

          <section id="view-trash" class="view" hidden>
            <header class="view-head">
              <div>
                <h1>回收站</h1>
                <p class="view-sub">删除的时光会先留在这里。</p>
              </div>
              <button type="button" class="button danger" data-testid="empty-trash-button" id="empty-trash-button">清空回收站</button>
            </header>
            <p class="trash-note">回收站不会自动清空，只有你手动操作才会永久删除。</p>
            <div id="trash-list" class="timeline-list"></div>
          </section>
        </div>
      </main>
    </div>

    <div id="store-blocked" data-testid="store-blocked" class="store-blocked" hidden>
      <div class="store-blocked-card">
        <h1 id="store-blocked-title"></h1>
        <p id="store-blocked-detail"></p>
        <p class="store-blocked-hint">这里不会写入或改动任何数据。请按上面的提示处理后再重新打开拾光。</p>
      </div>
    </div>

    <dialog id="confirm-dialog" data-testid="confirm-dialog" class="confirm-dialog">
      <h2 id="confirm-title"></h2>
      <p id="confirm-message"></p>
      <div class="confirm-actions">
        <button type="button" class="button ghost" data-testid="confirm-cancel" id="confirm-cancel">取消</button>
        <button type="button" class="button danger" data-testid="confirm-ok" id="confirm-ok">确定</button>
      </div>
    </dialog>

    <script type="module" src="./ui/main.js"></script>
  </body>
</html>
